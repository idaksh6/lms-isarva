name: Deploy to production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Upload build assets to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "public/build"
          target: ${{ secrets.SSH_APP_DIR }}
          strip_components: 1

      - name: Deploy application over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP="${{ secrets.SSH_APP_DIR }}"
            cd "$APP"
            git fetch origin main
            git reset --hard origin/main
            composer install --no-dev --optimize-autoloader --no-interaction
            mkdir -p public/build public_html/build
            rsync -a --delete build/ public/build/
            rsync -a --delete build/ public_html/build/
            for item in index.php .htaccess robots.txt favicon.ico images; do
              if [ -e "public/$item" ]; then
                rsync -a "public/$item" public_html/
              fi
            done
            php artisan storage:link 2>/dev/null || true
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            chmod -R ug+rwx storage bootstrap/cache 2>/dev/null || true
            echo "Deploy OK"
